name: Build Windows EXE

on:
  push:
    branches:
      - desktop-exe-0.3
      - base-import-client-0.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate gameplay tests
        run: npm run test

      - name: Build Vite client
        run: npm run build

      - name: Package portable Windows EXE
        run: npm run desktop:build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-no-vale-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
